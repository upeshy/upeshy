<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px;}
h1{color:#38bdf8;}
h2{color:#facc15;margin-top:30px;}

input,textarea,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:none;
}

button{
  padding:8px 12px;
  border:none;
  background:#0ea5e9;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

button:hover{background:#0284c7;}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #334155;
  padding:8px;
  text-align:center;
}

img{
  width:50px;
  height:50px;
  border-radius:50%;
}

.modal{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
}

.modal-content{
  background:white;
  color:black;
  padding:20px;
  margin:50px auto;
  width:90%;
  max-width:400px;
  border-radius:10px;
}
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>
<body>

<h1>🔥 Admin Dashboard</h1>


<!-- ================= RECORDS ================= -->
<h2>📋 Student Records</h2>

<select id="categorySelect" onchange="loadRecords()">
  <option value="computer">Computer</option>
  <option value="coaching">Coaching</option>
</select>

<table>
<thead>
<tr>
<th>Name</th><th>Father</th><th>Mother</th><th>Phone</th>
        <th>Email</th><th>DOB</th><th>Course</th><th>Address</th>
        <th>Photo</th><th>Actions</th>
</tr>
</thead>
<tbody id="recordsTable"></tbody>
</table>

<!-- ================= TEACHERS ================= -->
<h2>👨‍🏫 Teachers</h2>

<select id="teacherSelect">
<option value="teacher1">Teacher 1</option>
<option value="teacher2">Teacher 2</option>
<option value="teacher3">Teacher 3</option>
</select>

<input id="t_name" placeholder="Name">
<input id="t_subject" placeholder="Subject">
<input id="t_image" placeholder="Image URL">

<button onclick="saveTeacher()">Save Teacher</button>

<!-- ================= UPDATES ================= -->
<h2>📢 Updates</h2>

<input id="u_title" placeholder="Title">
<input id="u_text" placeholder="Text">
<button onclick="addUpdate()">Add</button>

<div id="updateList"></div>

<!-- ================= ABOUT ================= -->
<h2>📘 About</h2>

<textarea id="aboutText"></textarea>
<button onclick="saveAbout()">Save</button>

<!-- ================= POPUP ================= -->
<h2>🎯 Popup</h2>

<input id="popupImage" placeholder="Image URL">
<input id="popupTitle" placeholder="Title">
<input id="popupText" placeholder="Text">
<button onclick="savePopup()">Save Popup</button>

<!-- ================= TOPBAR ================= -->
<h2>🔔 Topbar</h2>

<input id="topbarInput">
<button onclick="saveTopbar()">Save</button>

<!-- ================= EDIT MODAL ================= -->
<div class="modal" id="editModal">
<div class="modal-content">

<h3>Edit Student</h3>

<input id="editName">
<input id="editFather">
<input id="editMother">
<input id="editPhone">
<input id="editEmail">
<input id="editDOB" type="date">
<input id="editCourse">
<textarea id="editAddress"></textarea>

<button onclick="updateRecord()">Save</button>
<button onclick="closeEditModal()">Close</button>

</div>
</div>

<script>

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCJbmgvBuJ-PP2U9kf_hJQ-rMWtAd551sA",
  authDomain: "game-bbdc6.firebaseapp.com",
  projectId: "game-bbdc6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let editId=null;

// ================= ADD =================


// ================= LOAD =================
function loadStudents(){
  studentList.innerHTML = "Loading...";

  const studentsRef = ref(db, `students/${currentCategory}`);

  onValue(studentsRef, snapshot=>{
    studentList.innerHTML = "";

    if(snapshot.exists()){
      snapshot.forEach(childSnap=>{
        let s = childSnap.val();
        let id = childSnap.key;

        studentList.innerHTML += `
          <div class="card">
            <b>${s.name || ""}</b> (${s.course || ""})<br>
            👨 Father: ${s.father || ""}<br>
            👩 Mother: ${s.mother || ""}<br>
            📞 ${s.phone || ""}<br>
            📧 ${s.email || ""}<br>
            🎂 ${s.dob || ""}<br>
            🏠 ${s.address || ""}<br>
            <img src="${s.photo || "https://via.placeholder.com/60"}" width="60"><br>

            <button onclick="openEditModal('${id}')">Edit</button>
            <button onclick="deleteStudent('${id}')">Delete</button>
          </div>
        `;
      });
    } else {
      studentList.innerHTML = "No Records Found";
    }
  });
}


// --- DELETE ---
function deleteStudent(id){
  if(confirm("Are you sure you want to delete?")){
    remove(ref(db, `students/${currentCategory}/${id}`))
      .then(()=>alert("Deleted ✅"))
      .catch(err=>alert("Error: "+err.message));
  }
}


// --- OPEN EDIT ---
function openEditModal(id){
  editKey = id;

  get(child(ref(db), `students/${currentCategory}/${id}`)).then(snap=>{
    let s = snap.val();

    edit_name.value = s.name || "";
    edit_father.value = s.father || "";
    edit_mother.value = s.mother || "";
    edit_phone.value = s.phone || "";
    edit_email.value = s.email || "";
    edit_dob.value = s.dob || "";
    edit_course.value = s.course || "";
    edit_address.value = s.address || "";

    editModal.style.display = "block";
  });
}


// --- UPDATE ---
function updateStudent(){
  const updatedData = {
    name: edit_name.value,
    father: edit_father.value,
    mother: edit_mother.value,
    phone: edit_phone.value,
    email: edit_email.value,
    dob: edit_dob.value,
    course: edit_course.value,
    address: edit_address.value
  };

  update(ref(db, `students/${currentCategory}/${editKey}`), updatedData)
    .then(()=>{
      alert("Updated ✅");
      closeEditModal();
    })
    .catch(err=>alert("Error: "+err.message));
}


// --- CLOSE MODAL ---
function closeEditModal(){
  editModal.style.display = "none";
}
function closeEditModal(){
  editModal.style.display="none";
}

// ================= UPDATES =================
function addUpdate(){
  db.collection("updates").add({
    title:u_title.value,
    text:u_text.value,
    createdAt:new Date()
  });
}

// realtime updates
db.collection("updates").orderBy("createdAt","desc")
.onSnapshot(snapshot=>{
  updateList.innerHTML="";

  snapshot.forEach(doc=>{
    let u=doc.data();

    updateList.innerHTML+=`
    <div style="background:#1e293b;padding:10px;margin:5px;border-radius:6px;">
      <b>${u.title}</b><br>${u.text}
      <button onclick="editUpdate('${doc.id}','${u.title}','${u.text}')">Edit</button>
      <button onclick="deleteUpdate('${doc.id}')">Delete</button>
    </div>`;
  });
});

function editUpdate(id,title,text){
  let t=prompt("Edit Title",title);
  let x=prompt("Edit Text",text);

  if(t && x){
    db.collection("updates").doc(id).update({
      title:t,
      text:x
    });
  }
}

function deleteUpdate(id){
  db.collection("updates").doc(id).delete();
}

// ================= SETTINGS =================
function saveAbout(){
  db.collection("settings").doc("about").set({text:aboutText.value});
}

function savePopup(){
  db.collection("settings").doc("popup").set({
    image:popupImage.value,
    title:popupTitle.value,
    text:popupText.value
  });
}

function saveTopbar(){
  db.collection("settings").doc("topbar").set({
    text:topbarInput.value
  });
}

// ================= TEACHERS =================
function saveTeacher(){
  db.collection("teachers").doc(teacherSelect.value).set({
    name:t_name.value,
    subject:t_subject.value,
    image:t_image.value
  });
}

// LOAD DEFAULT
loadRecords();

</script>

</body>
</html>
<button onclick="saveTeacher()">Save Teacher</button>

<!-- UPDATES -->
<h2>📢 Updates</h2>

<input id="u_title" placeholder="Title">
<input id="u_text" placeholder="Text">
<button onclick="addUpdate()">Add Update</button>

<div id="updateList"></div>

<!-- ABOUT -->
<h2>📘 About</h2>

<textarea id="aboutText"></textarea>
<button onclick="saveAbout()">Save</button>

<!-- POPUP -->
<h2>🎯 Popup</h2>

<input id="popupImage" placeholder="Image URL">
<input id="popupTitle" placeholder="Title">
<input id="popupText" placeholder="Text">
<button onclick="savePopup()">Save Popup</button>

<!-- TOPBAR -->
<h2>🔔 Topbar</h2>

<input id="topbarInput">
<button onclick="saveTopbar()">Save</button>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <span class="close" onclick="closeEditModal()">✖</span>
    <h3>Edit Student</h3>

    <input id="edit_name">
    <input id="edit_phone">

    <button onclick="updateStudent()">Update</button>
  </div>
</div>

<script>

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCJbmgvBuJ-PP2U9kf_hJQ-rMWtAd551sA",
  authDomain: "game-bbdc6.firebaseapp.com",
  projectId: "game-bbdc6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let editStudentId = null;

// ================= STUDENTS =================


function loadStudents(){
  studentList.innerHTML="Loading...";

  db.collection("students").get().then(data=>{
    studentList.innerHTML="";

    data.forEach(d=>{
      let s = d.data();

      studentList.innerHTML += `
        <div class="card">
          <b>${s.name || ""}</b> (${s.course || ""})<br>
          📞 ${s.phone || ""}<br>
          <img src="${s.photo || "https://via.placeholder.com/60"}"><br>
          <button onclick="openEditModal('${d.id}')">Edit</button>
          <button onclick="deleteStudent('${d.id}')">Delete</button>
        </div>
      `;
    });
  });
}

function deleteStudent(id){
  if(confirm("Delete?")){
    db.collection("students").doc(id).delete()
    .then(()=>loadStudents());
  }
}

function openEditModal(id){
  editStudentId = id;

  db.collection("students").doc(id).get().then(doc=>{
    let s = doc.data();

    edit_name.value = s.name;
    edit_phone.value = s.phone;

    editModal.style.display="block";
  });
}

function updateStudent(){
  db.collection("students").doc(editStudentId).update({
    name: edit_name.value,
    phone: edit_phone.value
  })
  .then(()=>{
    alert("Updated ✅");
    closeEditModal();
    loadStudents();
  });
}

function closeEditModal(){
  editModal.style.display="none";
}

// ================= TEACHERS =================
function saveTeacher(){
  db.collection("teachers").doc(teacherSelect.value).set({
    name: t_name.value,
    subject: t_subject.value,
    image: t_image.value
  })
  .then(()=>alert("Teacher Saved ✅"));
}

// ================= UPDATES =================
function addUpdate(){

  if(!u_title.value){
    alert("Title required ❌");
    return;
  }

  db.collection("updates").add({
    title: u_title.value,
    text: u_text.value
  })
  .then(()=>{
    u_title.value="";
    u_text.value="";
    loadUpdates();
  });
}

function loadUpdates(){
  updateList.innerHTML="Loading...";

  db.collection("updates").get().then(data=>{
    updateList.innerHTML="";

    data.forEach(d=>{
      let u = d.data();

      updateList.innerHTML += `
        <div class="card">
          <b>${u.title}</b><br>${u.text}
          <button onclick="deleteUpdate('${d.id}')">Delete</button>
        </div>
      `;
    });
  });
}

function deleteUpdate(id){
  db.collection("updates").doc(id).delete()
  .then(()=>loadUpdates());
}

// ================= SETTINGS =================
function saveAbout(){
  db.collection("settings").doc("about").set({
    text: aboutText.value
  }).then(()=>alert("Saved ✅"));
}

function savePopup(){
  db.collection("settings").doc("popup").set({
    image: popupImage.value,
    title: popupTitle.value,
    text: popupText.value
  }).then(()=>alert("Popup Saved ✅"));
}

function saveTopbar(){
  db.collection("settings").doc("topbar").set({
    text: topbarInput.value
  }).then(()=>alert("Topbar Saved ✅"));
}

// LOAD
loadStudents();
loadUpdates();

</script>

</body>
</html>
