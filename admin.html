<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:white;padding:20px;}
h1{color:#38bdf8;} h2{color:#facc15;margin-top:30px;}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:none;}
button{padding:8px 12px;border:none;background:#0ea5e9;color:white;border-radius:6px;cursor:pointer;}
button:hover{background:#0284c7;}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px;}
.card img{width:60px;border-radius:6px;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;}
.modal-content{background:white;color:black;padding:20px;margin:50px auto;width:90%;max-width:400px;border-radius:10px;}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

<h1>🔥 Admin Panel</h1>

<!-- LOGIN -->
<div id="loginDiv">
  <h2>🔐 Login</h2>
  <input id="loginEmail" type="email" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<h2>📋 Students</h2>
<select id="categorySelect" onchange="loadStudents()">
  <option value="computer">computer</option>
  <option value="coaching">coaching</option>
</select>
<div id="studentList"></div>

<!-- Edit Modal -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Edit Student</h3>
    <input id="edit_name" placeholder="Name">
    <input id="edit_father" placeholder="Father">
    <input id="edit_mother" placeholder="Mother">
    <input id="edit_phone" placeholder="Phone">
    <input id="edit_email" placeholder="Email">
    <input id="edit_dob" type="date">
    <input id="edit_course" placeholder="Course">
    <textarea id="edit_address" placeholder="Address"></textarea>
    <button onclick="updateStudent()">Update</button>
    <button onclick="closeEditModal()">Close</button>
  </div>
</div>

<h2>👨‍🏫 Teachers</h2>
<select id="teacherSelect" onchange="loadTeacher()">
<option value="teacher1">Teacher 1</option>
<option value="teacher2">Teacher 2</option>
<option value="teacher3">Teacher 3</option>
</select>
<input id="t_name" placeholder="Name">
<input id="t_subject" placeholder="Subject">
<input id="t_image" placeholder="Image URL">
<button onclick="saveTeacher()">Save Teacher</button>

<h2>📄 PDF Notes</h2>
<input id="pdfTitle" placeholder="PDF Title">
<button onclick="uploadPDF()">Upload PDF</button>
<div id="pdfList"></div>

<h2>📢 Updates</h2>
<input id="u_title" placeholder="Title">
<input id="u_text" placeholder="Text">
<button onclick="addUpdate()">Add</button>
<div id="updateList"></div>

<h2>📘 About</h2>
<textarea id="aboutText"></textarea>
<button onclick="saveAbout()">Save</button>

<h2>🎯 Popup</h2>
<input id="popupImage" placeholder="Image URL">
<input id="popupTitle" placeholder="Title">
<input id="popupText" placeholder="Text">
<button onclick="savePopup()">Save Popup</button>

<h2>🔔 Topbar</h2>
<input id="topbarInput">
<button onclick="saveTopbar()">Save</button>
<h2>🎬 Manage YouTube Videos</h2>

<input type="text" id="videoTitle" placeholder="Video Title">
<input type="text" id="videoURL" placeholder="YouTube Link">

<button class="add-btn" onclick="addVideo()">Add Video</button>

<hr>

<div id="videoList">Loading...</div>
<button onclick="logout()" style="background:red;margin-top:20px;">Logout</button>

</div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCJbmgvBuJ-PP2U9kf_hJQ-rMWtAd551sA",
  authDomain: "game-bbdc6.firebaseapp.com",
  projectId: "game-bbdc6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let editStudentId = null;

// ================= LOGIN =================
function login(){
  const email = document.getElementById("loginEmail").value;
  const pass = document.getElementById("loginPassword").value;
  if(!email || !pass){ alert("Email & Password required"); return; }

  auth.signInWithEmailAndPassword(email, pass)
  .then(()=>{
    alert("Logged in ✅");
    document.getElementById("loginDiv").style.display="none";
    document.getElementById("dashboard").style.display="block";
    loadStudents(); loadPDFs(); loadTeacher(); loadAbout(); loadPopup(); loadTopbar();
  })
  .catch(err=>alert(err.message));
}

function logout(){
  auth.signOut().then(()=>{
    document.getElementById("loginDiv").style.display="block";
    document.getElementById("dashboard").style.display="none";
  });
}
async function addVideo(){
  await addDoc(collection(db,"videos"),{
    title: document.getElementById("videoTitle").value,
    url: document.getElementById("videoURL").value,
    createdAt: new Date()
  });

  alert("Video Added ✅");
}
// ================= STUDENTS =================
function loadStudents(){
  const category = document.getElementById("categorySelect").value;
  const studentList = document.getElementById("studentList");
  studentList.innerHTML = "Loading...";

  db.collection("students")
    .where("type","==",category)
    .get()
    .then(snapshot=>{
      studentList.innerHTML = "";
      if(snapshot.empty){ studentList.innerHTML="No Records"; return; }

      snapshot.forEach(doc=>{
        let s = doc.data();
        const div = document.createElement("div");
        div.className="card";
        div.innerHTML = `
          <b>${s.name || ""}</b> (${s.course || ""})<br>
          👨 Father: ${s.father || ""}<br>
          👩 Mother: ${s.mother || ""}<br>
          📞 ${s.phone || ""}<br>
          📧 ${s.email || ""}<br>
          🎂 ${s.dob || ""}<br>
          🏠 ${s.address || ""}<br>
        `;
        const editBtn = document.createElement("button");
        editBtn.innerText="Edit"; editBtn.style.marginRight="6px";
        editBtn.onclick = ()=>openEditModal(doc.id);
        const deleteBtn=document.createElement("button");
        deleteBtn.innerText="Delete"; deleteBtn.onclick=()=>deleteStudent(doc.id);
        div.appendChild(editBtn); div.appendChild(deleteBtn);
        studentList.appendChild(div);
      });
    })
    .catch(err=>alert(err.message));
}

function openEditModal(id){
  editStudentId=id;
  db.collection("students").doc(id).get().then(doc=>{
    if(!doc.exists){ alert("Student not found ❌"); return; }
    let s=doc.data();
    document.getElementById("edit_name").value=s.name||"";
    document.getElementById("edit_father").value=s.father||"";
    document.getElementById("edit_mother").value=s.mother||"";
    document.getElementById("edit_phone").value=s.phone||"";
    document.getElementById("edit_email").value=s.email||"";
    document.getElementById("edit_dob").value=s.dob||"";
    document.getElementById("edit_course").value=s.course||"";
    document.getElementById("edit_address").value=s.address||"";
    document.getElementById("editModal").style.display="block";
  });
}
function updateStudent(){
  db.collection("students").doc(editStudentId).update({
    name: document.getElementById("edit_name").value,
    father: document.getElementById("edit_father").value,
    mother: document.getElementById("edit_mother").value,
    phone: document.getElementById("edit_phone").value,
    email: document.getElementById("edit_email").value,
    dob: document.getElementById("edit_dob").value,
    course: document.getElementById("edit_course").value,
    address: document.getElementById("edit_address").value
  }).then(()=>{ alert("Updated ✅"); closeEditModal(); loadStudents(); })
  .catch(err=>alert(err.message));
}
function closeEditModal(){ document.getElementById("editModal").style.display="none"; }
function deleteStudent(id){ if(confirm("Delete?")){ db.collection("students").doc(id).delete().then(()=>loadStudents()); } }
// ================= ADD =================
function loadVideos(){
  db.collection("videos").get().then(snapshot=>{
    let html = "";

    if(snapshot.empty){
      html = "No Videos Found";
    }

    snapshot.forEach(doc=>{
      let v = doc.data();

      html += `
        <div class="card">
          <b>${v.title || "No Title"}</b><br>
          <small>${v.url}</small><br><br>

          <button onclick="deleteVideo('${doc.id}')">
            Delete
          </button>
        </div>
      `;
    });

    document.getElementById("videoList").innerHTML = html;
  });
}

// ================= LOAD =================
async function addVideo(){
  const title = document.getElementById("videoTitle").value;
  const url = document.getElementById("videoURL").value;

  if(!url){
    alert("Enter YouTube Link");
    return;
  }

  db.collection("videos").add({
    title: title,
    url: url,
    createdAt: new Date()
  })
  .then(()=>{
    alert("Video Added ✅");

    document.getElementById("videoTitle").value = "";
    document.getElementById("videoURL").value = "";

    loadVideos();
  })
  .catch(err=>alert(err.message));
}

// ================= DELETE =================
function deleteVideo(id){
  if(confirm("Delete this video?")){
    db.collection("videos").doc(id).delete()
    .then(()=>{
      alert("Deleted ❌");
      loadVideos();
    })
    .catch(err=>alert(err.message));
  }
}

// 🔥 AUTO LOAD
loadVideos();
// ================= TEACHERS =================
function saveTeacher(){
  const id=document.getElementById("teacherSelect").value;
  db.collection("teachers").doc(id).set({
    name:document.getElementById("t_name").value,
    subject:document.getElementById("t_subject").value,
    image:document.getElementById("t_image").value
  }).then(()=>alert("Teacher Saved ✅"))
  .catch(err=>alert(err.message));
}
function loadTeacher(){
  const id=document.getElementById("teacherSelect").value;
  db.collection("teachers").doc(id).get().then(doc=>{
    if(doc.exists){
      let t=doc.data();
      document.getElementById("t_name").value=t.name||"";
      document.getElementById("t_subject").value=t.subject||"";
      document.getElementById("t_image").value=t.image||"";
    } else { document.getElementById("t_name").value=""; document.getElementById("t_subject").value=""; document.getElementById("t_image").value=""; }
  });
}

// ================= PDF =================
function uploadPDF(){
  const title=document.getElementById("pdfTitle").value;
  const url=prompt("Google Drive PDF Link");
  if(!title||!url){ alert("Title & URL required"); return; }
  db.collection("pdfs").add({title,fileURL:url,createdAt:new Date()})
  .then(()=>{ alert("PDF Added ✅"); loadPDFs(); })
  .catch(err=>alert(err.message));
}
function loadPDFs(){
  const pdfList=document.getElementById("pdfList");
  db.collection("pdfs").orderBy("createdAt","desc").onSnapshot(snapshot=>{
    pdfList.innerHTML="";
    snapshot.forEach(doc=>{
      let p=doc.data();
      const div=document.createElement("div"); div.className="card";
      div.innerHTML=`📄 <b>${p.title}</b><br><a href="${p.fileURL}" target="_blank">View PDF</a><br>`;
      const delBtn=document.createElement("button"); delBtn.innerText="Delete"; delBtn.onclick=()=>db.collection("pdfs").doc(doc.id).delete();
      div.appendChild(delBtn); pdfList.appendChild(div);
    });
  });
}

// ================= UPDATES =================
function addUpdate(){
  db.collection("updates").add({title:document.getElementById("u_title").value,text:document.getElementById("u_text").value,createdAt:new Date()})
  .then(()=>alert("Update Added ✅")).catch(err=>alert(err.message));
}
db.collection("updates").orderBy("createdAt","desc").onSnapshot(snapshot=>{
  const updateList=document.getElementById("updateList"); updateList.innerHTML="";
  snapshot.forEach(doc=>{
    let u=doc.data();
    const div=document.createElement("div"); div.className="card";
    div.innerHTML=`<b>${u.title}</b><br>${u.text}`;
    const delBtn=document.createElement("button"); delBtn.innerText="Delete"; delBtn.onclick=()=>db.collection("updates").doc(doc.id).delete();
    div.appendChild(delBtn); updateList.appendChild(div);
  });
});

// ================= SETTINGS =================
function saveAbout(){ db.collection("settings").doc("about").set({text:document.getElementById("aboutText").value}).then(()=>alert("Saved ✅")).catch(err=>alert(err.message)); }
function savePopup(){ db.collection("settings").doc("popup").set({image:document.getElementById("popupImage").value,title:document.getElementById("popupTitle").value,text:document.getElementById("popupText").value}).then(()=>alert("Saved ✅")).catch(err=>alert(err.message)); }
function saveTopbar(){ db.collection("settings").doc("topbar").set({text:document.getElementById("topbarInput").value}).then(()=>alert("Saved ✅")).catch(err=>alert(err.message)); }
function loadAbout(){ db.collection("settings").doc("about").get().then(doc=>{ if(doc.exists)document.getElementById("aboutText").value=doc.data().text||""; }); }
function loadPopup(){ db.collection("settings").doc("popup").get().then(doc=>{ if(doc.exists){ let p=doc.data(); document.getElementById("popupImage").value=p.image||""; document.getElementById("popupTitle").value=p.title||""; document.getElementById("popupText").value=p.text||""; } }); }
function loadTopbar(){ db.collection("settings").doc("topbar").get().then(doc=>{ if(doc.exists)document.getElementById("topbarInput").value=doc.data().text||""; }); }

</script>
</body>
</html>
