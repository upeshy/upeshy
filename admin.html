<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px;}
h1{color:#38bdf8;}
h2{color:#facc15;margin-top:30px;}

input,textarea,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  border:none;
}

button{
  padding:8px 12px;
  border:none;
  background:#0ea5e9;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
button:hover{background:#0284c7;}

.card{
  background:#1e293b;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

.card img{
  width:60px;
  border-radius:6px;
}

.modal{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
}
.modal-content{
  background:white;
  color:black;
  padding:20px;
  margin:50px auto;
  width:90%;
  max-width:400px;
  border-radius:10px;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


</head>
<body>

<h1>🔥 Admin Dashboard</h1>
<!-- PDF UPLOAD -->
<h2>📄 Upload PDF Notes</h2>

<input type="text" id="pdfTitle" placeholder="Enter PDF Title">


<button onclick="uploadPDF()">Upload PDF</button>

<div id="pdfList"></div>
<!-- STUDENTS -->
<h2>📋 Student Records</h2>

<select id="categorySelect" onchange="loadStudents()">
  <option value="computer">Computer</option>
  <option value="coaching">Coaching</option>
</select>

<div id="studentList"></div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Edit Student</h3>

    <input id="edit_name" placeholder="Name">
    <input id="edit_father" placeholder="Father">
    <input id="edit_mother" placeholder="Mother">
    <input id="edit_phone" placeholder="Phone">
    <input id="edit_email" placeholder="Email">
    <input id="edit_dob" type="date">
    <input id="edit_course" placeholder="Course">
    <textarea id="edit_address" placeholder="Address"></textarea>

    <button onclick="updateStudent()">Update</button>
    <button onclick="closeEditModal()">Close</button>
  </div>
</div>

<!-- TEACHERS -->
<h2>👨‍🏫 Teachers</h2>

<select id="teacherSelect" onchange="loadTeacher()">
<option value="teacher1">Teacher 1</option>
<option value="teacher2">Teacher 2</option>
<option value="teacher3">Teacher 3</option>
</select>

<input id="t_name" placeholder="Name">
<input id="t_subject" placeholder="Subject">
<input id="t_image" placeholder="Image URL">

<button onclick="saveTeacher()">Save Teacher</button>

<!-- UPDATES -->
<h2>📢 Updates</h2>

<input id="u_title" placeholder="Title">
<input id="u_text" placeholder="Text">
<button onclick="addUpdate()">Add</button>

<div id="updateList"></div>

<!-- ABOUT -->
<h2>📘 About</h2>
<textarea id="aboutText"></textarea>
<button onclick="saveAbout()">Save</button>

<!-- POPUP -->
<h2>🎯 Popup</h2>
<input id="popupImage" placeholder="Image URL">
<input id="popupTitle" placeholder="Title">
<input id="popupText" placeholder="Text">
<button onclick="savePopup()">Save Popup</button>

<!-- TOPBAR -->
<h2>🔔 Topbar</h2>
<input id="topbarInput">
<button onclick="saveTopbar()">Save</button>

<script>

// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCJbmgvBuJ-PP2U9kf_hJQ-rMWtAd551sA",
  authDomain: "game-bbdc6.firebaseapp.com",
  projectId: "game-bbdc6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let editStudentId = null;


// ================= STUDENTS =================
function loadStudents(){
  const category = document.getElementById("categorySelect").value;
  const studentList = document.getElementById("studentList");

  studentList.innerHTML = "Loading...";

  db.collection("students")
    .where("category","==",category)
    .get()
    .then(snapshot=>{
      studentList.innerHTML = "";

      if(snapshot.empty){
        studentList.innerHTML = "No Records Found";
        return;
      }

      snapshot.forEach(doc=>{
        let s = doc.data();

        studentList.innerHTML += `
          <div class="card">
            <b>${s.name || ""}</b> (${s.course || ""})<br>
            👨 Father: ${s.father || ""}<br>
            👩 Mother: ${s.mother || ""}<br>
            📞 ${s.phone || ""}<br>
            📧 ${s.email || ""}<br>
            🎂 ${s.dob || ""}<br>
            🏠 ${s.address || ""}<br>
            <img src="${s.photo || "https://via.placeholder.com/60"}"><br>

            <button onclick="openEditModal('${doc.id}')">Edit</button>
            <button onclick="deleteStudent('${doc.id}')">Delete</button>
          </div>
        `;
      });
    })
    .catch(err=>alert(err.message));
}

function deleteStudent(id){
  if(confirm("Delete this student?")){
    db.collection("students").doc(id).delete()
    .then(()=>{
      alert("Deleted ✅");
      loadStudents();
    });
  }
}

function openEditModal(id){
  editStudentId = id;

  db.collection("students").doc(id).get().then(doc=>{
    let s = doc.data();

    document.getElementById("edit_name").value = s.name || "";
    document.getElementById("edit_father").value = s.father || "";
    document.getElementById("edit_mother").value = s.mother || "";
    document.getElementById("edit_phone").value = s.phone || "";
    document.getElementById("edit_email").value = s.email || "";
    document.getElementById("edit_dob").value = s.dob || "";
    document.getElementById("edit_course").value = s.course || "";
    document.getElementById("edit_address").value = s.address || "";

    document.getElementById("editModal").style.display = "block";
  });
}

function updateStudent(){
  db.collection("students").doc(editStudentId).update({
    name: document.getElementById("edit_name").value,
    father: document.getElementById("edit_father").value,
    mother: document.getElementById("edit_mother").value,
    phone: document.getElementById("edit_phone").value,
    email: document.getElementById("edit_email").value,
    dob: document.getElementById("edit_dob").value,
    course: document.getElementById("edit_course").value,
    address: document.getElementById("edit_address").value
  })
  .then(()=>{
    alert("Updated ✅");
    closeEditModal();
    loadStudents();
  })
  .catch(err=>alert(err.message));
}

function closeEditModal(){
  document.getElementById("editModal").style.display = "none";
}


// ================= TEACHERS =================
function saveTeacher(){
  db.collection("teachers").doc(document.getElementById("teacherSelect").value).set({
    name: document.getElementById("t_name").value,
    subject: document.getElementById("t_subject").value,
    image: document.getElementById("t_image").value
  })
  .then(()=>alert("Teacher Saved ✅"))
  .catch(err=>alert(err.message));
}


// ================= UPDATES =================
function addUpdate(){
  db.collection("updates").add({
    title: document.getElementById("u_title").value,
    text: document.getElementById("u_text").value,
    createdAt: new Date()
  })
  .then(()=>alert("Update Added ✅"))
  .catch(err=>alert(err.message));
}

db.collection("updates").orderBy("createdAt","desc")
.onSnapshot(snapshot=>{
  const updateList = document.getElementById("updateList");
  updateList.innerHTML = "";

  snapshot.forEach(doc=>{
    let u = doc.data();

    updateList.innerHTML += `
      <div class="card">
        <b>${u.title}</b><br>${u.text}
        <button onclick="deleteUpdate('${doc.id}')">Delete</button>
      </div>
    `;
  });
});

function deleteUpdate(id){
  db.collection("updates").doc(id).delete();
}

// ================= PDF SYSTEM =================

// Storage init


// UPLOAD PDF
function uploadPDF(){
  const title = document.getElementById("pdfTitle").value;

  const url = prompt("Google Drive PDF link daalo");

  if(!title || !url){
    alert("Title aur PDF link daalo ❌");
    return;
  }

  db.collection("pdfs").add({
    title: title,
    fileURL: url,
    createdAt: new Date()
  })
  .then(()=>{
    alert("PDF Add ho gaya ✅");
    loadPDFs();
  })
  .catch(err=>{
    alert("Error: " + err.message);
  });
}

// LOAD PDFs
function loadPDFs(){
  const pdfList = document.getElementById("pdfList");

  db.collection("pdfs").orderBy("createdAt","desc")
  .onSnapshot(snapshot=>{
    pdfList.innerHTML = "";

    snapshot.forEach(doc=>{
      let p = doc.data();

      pdfList.innerHTML += `
        <div class="card">
          📄 <b>${p.title}</b><br>
          <a href="${p.fileURL}" target="_blank">View PDF</a><br>
          <button onclick="deletePDF('${doc.id}')">Delete</button>
        </div>
      `;
    });

  });
}


// DELETE PDF
function deletePDF(id){
  if(confirm("Delete PDF?")){
    db.collection("pdfs").doc(id).delete()
    .then(()=>alert("Deleted ✅"));
  }
}
// ================= SETTINGS =================
function saveAbout(){
  const text = document.getElementById("aboutText").value;

  db.collection("settings").doc("about").set({text})
  .then(()=>alert("About Saved ✅"))
  .catch(err=>alert(err.message));
}

function savePopup(){
  db.collection("settings").doc("popup").set({
    image: document.getElementById("popupImage").value,
    title: document.getElementById("popupTitle").value,
    text: document.getElementById("popupText").value
  })
  .then(()=>alert("Popup Saved ✅"))
  .catch(err=>alert(err.message));
}

function saveTopbar(){
  const text = document.getElementById("topbarInput").value;

  db.collection("settings").doc("topbar").set({text})
  .then(()=>alert("Topbar Saved ✅"))
  .catch(err=>alert(err.message));
}
function loadAbout(){
  db.collection("settings").doc("about").get()
  .then(doc=>{
    if(doc.exists){
      document.getElementById("aboutText").value = doc.data().text || "";
    }
  });
                }
  function loadPopup(){
  db.collection("settings").doc("popup").get()
  .then(doc=>{
    if(doc.exists){
      const p = doc.data();

      document.getElementById("popupImage").value = p.image || "";
      document.getElementById("popupTitle").value = p.title || "";
      document.getElementById("popupText").value = p.text || "";
    }
  });
  }
  function loadTopbar(){
  db.collection("settings").doc("topbar").get()
  .then(doc=>{
    if(doc.exists){
      document.getElementById("topbarInput").value = doc.data().text || "";
    }
  });
  }
function loadTeacher(){
  const id = document.getElementById("teacherSelect").value;

  db.collection("teachers").doc(id).get()
  .then(doc=>{
    if(doc.exists){
      let t = doc.data();

      document.getElementById("t_name").value = t.name || "";
      document.getElementById("t_subject").value = t.subject || "";
      document.getElementById("t_image").value = t.image || "";
    }else{
      // agar data nahi hai to blank karo
      document.getElementById("t_name").value = "";
      document.getElementById("t_subject").value = "";
      document.getElementById("t_image").value = "";
    }
  });
    }
// LOAD
loadStudents();
loadPDFs();
loadAbout();
loadPopup();
loadTopbar();
loadTeacher();
</script>

</body>
</html>
